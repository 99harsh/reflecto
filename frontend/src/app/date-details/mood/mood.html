<section class="rfto-mood-container">
    <div class="rfto-back-btn-container">
        <button class="rfto-back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-left w-4 h-4 mr-2">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>
            Back to Calendar
        </button>
    </div>
    <div class="rfto-heading-container">
        <div>
            <h1>Mood Analysis</h1>
            <p>Wednesday, August 20, 2025</p>
        </div>
    </div>

    <div class="rfto-card rfto-mood-card-container rfto-shadow-lg">
        <h1 class="rfto-mood-emoj">😴</h1>
        <h2 class="rfto-mood-name">Tired</h2>
        <h2 class="rfto-intensity-heading">Intensity: 5/10</h2>
        <div class="rfto-intensity-progressbar">
            <app-progressbar [progress]="20"></app-progressbar>
        </div>
        <p class="rfto-mood-quote">"A bit tired but content with the day."</p>
        <p class="rfto-mood-logged">Logged at 9:30AM</p>
    </div>
</section>
