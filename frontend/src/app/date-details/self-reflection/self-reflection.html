<section class="rfto-section">
    <div class="rfto-back-btn-container">
        <button class="rfto-back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-left w-4 h-4 mr-2">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>
            Back to Calendar
        </button>
    </div>
    <div class="rfto-heading-container">
        <div>
            <h1>Self Reflection</h1>
            <p>Wednesday, August 20, 2025</p>
        </div>
        <div class="rfto-export-button-container">
            <button class="rfto-export-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-download w-4 h-4 mr-2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" x2="12" y1="15" y2="3"></line>
                </svg>
                Export
            </button>
        </div>
    </div>
    <div class="rfto-content-container">
        @if(isEditor()){
        <ngx-editor [editor]="editor" [placeholder]="'Type here...'" [ngModel]="editorText()"
            [disabled]="true"></ngx-editor>
        }
    </div>
</section>
