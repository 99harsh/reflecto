<section class="rfto-date-details-container">
    <div class="rfto-back-btn-container">
        <button class="rfto-back-btn" (click)="goBack()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-left w-4 h-4 mr-2">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>
            Back to Calendar
        </button>
    </div>
    <div class="rfto-date-container rfto-shadow-lg">
        <h3>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-calendar w-8 h-8 mr-3 text-amber-600">
                <path d="M8 2v4"></path>
                <path d="M16 2v4"></path>
                <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                <path d="M3 10h18"></path>
            </svg>
            {{currentDate()}}.
        </h3>
        <p>Complete day overview and detailed insights</p>
    </div>

    <div class="rfto-card-container">
        @if(loading()){
        <div class="rfto-card rfto-pink-card">
            <div class="rfto-center-loading">
                 <app-skeleton color="rfto-pink" height="3rem" width="8rem"></app-skeleton>
                 <app-skeleton color="rfto-pink" height="1.3rem" width="5rem"></app-skeleton>
                 <app-skeleton color="rfto-pink" height="1.4rem" width="4.5rem"></app-skeleton>
                 <app-skeleton color="rfto-pink" height="2rem" width="7rem"></app-skeleton>
            </div>
        </div>
        <div class="rfto-card rfto-blue-card">
            <div class="rfto-center-loading">
                   <app-skeleton color="rfto-blue" height="3rem" width="8rem"></app-skeleton>
                 <app-skeleton color="rfto-blue" height="1.3rem" width="5rem"></app-skeleton>
                 <app-skeleton color="rfto-blue" height="1.4rem" width="4.5rem"></app-skeleton>
                 <app-skeleton color="rfto-blue" height="2rem" width="7rem"></app-skeleton>
            </div>
        </div>
        <div class="rfto-card rfto-purple-card">
          <div class="rfto-center-loading">
               <app-skeleton color="rfto-purple" height="3rem" width="8rem"></app-skeleton>
                 <app-skeleton color="rfto-purple" height="1.3rem" width="5rem"></app-skeleton>
                 <app-skeleton color="rfto-purple" height="1.4rem" width="4.5rem"></app-skeleton>
                 <app-skeleton color="rfto-purple" height="2rem" width="7rem"></app-skeleton>
          </div>
        </div>
        <div class="rfto-card rfto-green-card">
            <div class="rfto-center-loading">
               <app-skeleton color="rfto-green" height="3rem" width="8rem"></app-skeleton>
                 <app-skeleton color="rfto-green" height="1.3rem" width="5rem"></app-skeleton>
                 <app-skeleton color="rfto-green" height="1.4rem" width="4.5rem"></app-skeleton>
                 <app-skeleton color="rfto-green" height="2rem" width="7rem"></app-skeleton>
          </div>
        </div>
        } @else{
        <div class="rfto-card rfto-pink-card">
            <h2 class="rfto-card-emoj"><svg height="50" width="50" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M8.55284 3.00012C7.93598 3.00012 7.23841 3.06514 6.57209 3.29224C2.55494 4.60387 1.26341 8.894 2.39877 12.43L2.40354 12.4448L2.40877 12.4595C3.03435 14.2174 4.04226 15.8127 5.35336 17.1249L5.36091 17.1324L5.36862 17.1398C7.23782 18.9323 9.27254 20.4953 11.4756 21.8515L11.9934 22.1703L12.5147 21.8573C14.7226 20.5315 16.7964 18.9254 18.6432 17.1474L18.649 17.1419L18.6547 17.1362C19.9771 15.8215 20.9851 14.2144 21.6015 12.4549L21.6066 12.4402L21.6113 12.4253C22.7251 8.89703 21.4401 4.60176 17.4507 3.30948C16.7976 3.09221 16.1236 3.00012 15.4648 3.00012C13.9828 3.00011 12.8858 3.62064 12.0004 4.25309C11.1219 3.62545 10.0176 3.00012 8.55284 3.00012Z"
                            fill="#ff0000"></path>
                    </g>
                </svg></h2>
            <h3 class="rfto-card-heading">Mood</h3>
            <p class="rfto-card-subheading">Intensity: {{insightData().intensity}}/10</p>
            <button [routerLink]="['/date-details/',dateParam(),'mood']" class="rfto-card-button">View Details <svg
                    xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-left w-4 h-4 mr-2">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg></button>
        </div>
        <div class="rfto-card rfto-blue-card">
            <h2 class="rfto-card-emoj"><svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"
                    viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-book-open w-12 h-12 mx-auto mb-3 text-blue-600">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg></h2>
            <h3 class="rfto-card-heading">Journal</h3>
            <p class="rfto-card-subheading">Locked</p>
            <button [routerLink]="['/date-details/',dateParam(),'journal']" class="rfto-card-button">View Details <svg
                    xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-left w-4 h-4 mr-2">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg></button>
        </div>
        <div class="rfto-card rfto-purple-card">
            <h2 class="rfto-card-emoj"><svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"
                    viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-star w-12 h-12 mx-auto mb-3 text-purple-600">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                    </polygon>
                </svg></h2>
            <h3 class="rfto-card-heading">Reflection</h3>
            <p class="rfto-card-subheading">Locked</p>
            <button [routerLink]="['/date-details/',dateParam(),'reflection']" class="rfto-card-button">View Details
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-left w-4 h-4 mr-2">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg></button>
        </div>
        <div class="rfto-card rfto-green-card">
            <h2 class="rfto-card-emoj"><svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"
                    viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-target w-12 h-12 mx-auto mb-3 text-green-600">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="6"></circle>
                    <circle cx="12" cy="12" r="2"></circle>
                </svg></h2>
            <h3 class="rfto-card-heading">Tasks</h3>
            <p class="rfto-card-subheading">{{insightData().completed_tasks}}/{{insightData().total_tasks}} Completed
            </p>
            <button [routerLink]="['/date-details/',dateParam(),'tasks']" class="rfto-card-button">View Details <svg
                    xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-left w-4 h-4 mr-2">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg></button>
        </div>
        }
    </div>
</section>
