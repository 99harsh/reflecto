<header class="rfto-header-container">
    <div class="rfto-logo-container">
        <a [routerLink]="['home']">
            <span class="rfto-logo-heading">Reflecto</span>
        </a>
    </div>
    <div class="rfto-nav-container">
        <div class="rfto-nav-item">
            <a [routerLink]="['home']" [ngClass]="{
                'rfto-nav-active': currentRoute === '/home'
            }">Home</a>
        </div>
        <div class="rfto-nav-item">
            <a [routerLink]="['journal']"
            [ngClass]="{
                'rfto-nav-active': currentRoute === '/journal'
            }">Journal</a>
        </div>
        <div class="rfto-nav-item">
            <a [routerLink]="['reflection']"
              [ngClass]="{
                'rfto-nav-active': currentRoute === '/reflection'
            }">Reflection</a>
        </div>
        <div class="rfto-nav-item">
            <a [routerLink]="['mood']"
              [ngClass]="{
                'rfto-nav-active': currentRoute === '/mood'
            }">Mood</a>
        </div>
        <div class="rfto-nav-item">
            <a [routerLink]="['calendar']"
              [ngClass]="{
                'rfto-nav-active': currentRoute === '/calendar'
            }">Calendar</a>
        </div>
        <div (click)="toggleDropdown()" class="rfto-nav-item rfto-user-logo profile-wrapper" #profileWrapper>
            <img src="user-icon.png" />
        </div>
        <div class="rfto-dropdown-menu" [class.show]="isDropdownOpen">
            <div class="rfto-dropdown-header">
                <div class="rfto-dropdown-avatar">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                            fill="currentColor" />
                        <path d="M12 14C7.58172 14 4 17.5817 4 22H20C20 17.5817 16.4183 14 12 14Z"
                            fill="currentColor" />
                    </svg>
                </div>
                <div class="rfto-dropdown-user-info">
                    <p class="rfto-dropdown-username">Harsh</p>
                    <p class="rfto-dropdown-email">&#64;hagrawal121</p>
                </div>
            </div>

            <div class="rfto-dropdown-divider"></div>

            <div class="rfto-dropdown-items">
                <button class="rfto-dropdown-item" (click)="navigateToProfile()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M19 21V15M19 15V9M19 15H5M5 21V15M5 15V9M5 15H19M9 9V3M15 9V3" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Profile 
                </button>

                <button class="rfto-dropdown-item" (click)="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </div>
</header>
