<div class="rfto-notebook-container">
  <div class="rfto-notebook-page">
    <div class="rfto-loading">
      <app-saving-loading></app-saving-loading>
    </div>
    <!-- Spiral binding holes -->
    <div class="rfto-spiral-holes">
      <div class="rfto-hole" *ngFor="let hole of getHoleArray(); trackBy: trackByIndex"></div>
    </div>

    <!-- Red margin line -->
    <div class="rfto-margin-line"></div>

    <!-- Page header -->
    <div class="rfto-page-header">
      <h1 class="rfto-journal-title">My Journal</h1>
      <div class="rfto-date">{{ currentDate() }}</div>
    </div>

    @if(isEditor()){
    <div class="rfto-writing-area">
      <div class="rfto-editor-menu-container">
        <ngx-editor-menu [editor]="editor"></ngx-editor-menu>
        <app-saving-loading [isLoading]="isSaving()" [isUpdated]="!isSaving()" [updatedAt]="updatedAt()"></app-saving-loading>
      </div>
      <ngx-editor [editor]="editor" [ngModel]="journalText()" (ngModelChange)="onTextChange($event)" [disabled]="false"
        [placeholder]="'Type here...'"></ngx-editor>
    </div>
    }

    <!-- Writing area -->
    <!-- <div class="rfto-writing-area">

        class="rfto-journal-textarea"

      <div class="rfto-ruled-lines">
        <div class="rfto-line" *ngFor="let line of getLineArray(); trackBy: trackByIndex"></div>
      </div>
    </div> -->
  </div>
</div>
