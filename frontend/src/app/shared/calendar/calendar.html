    <div class="rfto-calendar-content">
        <div class="calendar-controls">
            <select [(ngModel)]="currentMonth" (change)="generateCalendar()">
                <option *ngFor="let m of monthList; index as i" [value]="i">{{ m }}</option>
            </select>

            <select [(ngModel)]="currentYear" (change)="generateCalendar()">
                <option *ngFor="let y of yearList" [value]="y">{{ y }}</option>
            </select>
        </div>

        <div class="calendar-header-days">
            <div *ngFor="let day of weekDays" class="day-header">{{ day }}</div>
        </div>

        <div class="calendar-days">
            <div *ngFor="let day of calendarDays" class="calendar-day" [class.other-month]="!day.isCurrentMonth"
                [class.today]="day.isToday" [class.has-entry]="day.hasEntry">
                <div class="day-number">{{ day.date }}</div>
                <div class="day-content">
                    <span *ngIf="day.mood" class="day-mood">{{ day.mood }}</span>
                    <span *ngIf="day.streak" class="day-streak">🔥</span>
                </div>
            </div>
        </div>
    </div>
