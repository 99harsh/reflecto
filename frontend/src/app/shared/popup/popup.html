@if(isOpen()){
<div class="popup-backdrop"  @fadeInOut (click)="!isBackdropLocked ? closePopup(): null">
    <div class="popup-content" [ngStyle]="{'width': width()}" @scaleInOut (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="closePopup()">×</button>
        <ng-content></ng-content>
    </div>
</div>
}
